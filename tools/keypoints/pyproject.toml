[project]
name = "rpod-keypoints"
version = "0.1.0"
description = "Train the M11 keypoint network on rendered QuikSCAT images and export ONNX"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "numpy>=2",
    "opencv-python-headless",
    "onnx>=1.23.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
